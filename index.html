<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Conversion</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<main>
  <h1>
    Temperature Converter
  </h1>

  <label for="temperature">Temperature</label>
  <input
  type="number"
  id="temperature"
  placeholder="Enter temperature:"
  >
  <label for="unit">Convert from:</label>
  <select id="unit">
   <option value="celsius">Celsius</option>
   <option value="fahrenheit">Fahrenheit</option>
  </select>

</main>
</body>
</html>

#16 label = The label tells the user what the box is for.
#17 input = The input is the box where they type the number.
#Then we can add the Celsius/Fahrenheit choice with 24&25.
#which creates a dropdown.
